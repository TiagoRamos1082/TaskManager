name: CI

on:
  pull_request:
    branches:
      - master

  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  php-syntax:
    name: PHP Syntax Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Validate PHP syntax
        run: |
          find . -type f -name '*.php' \
            -not -path './.git/*' \
            -not -path './vendor/*' \
            -print0 | xargs -0 -r -n1 php -l
